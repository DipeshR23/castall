version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - castall

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
      - STUN_SERVER=stun:stun.l.google.com:19302
    networks:
      - castall

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    networks:
      - castall

networks:
  castall:
    driver: bridge
